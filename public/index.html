<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-NOSIS</title>
<meta name="description" content="G-NOSIS: sobrevive 14 días en una base lunar. Juego educativo para niños de 7 a 12 años con datos reales de la NASA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* G-NOSIS: lienzo ASCII 16:9 (intro, base y finales) con el HUD de la base encima, y debajo las herramientas del equipo, plegadas. Un solo look oscuro, el de la intro. */
:root {
  --negro: rgb(0, 0, 0);
  --ink: rgb(235, 240, 255);
  --dim: rgb(150, 156, 185);
  --faint: rgb(84, 90, 124);
  --crema: rgb(255, 246, 225);
  --lila: rgb(168, 162, 232);
  --cian: rgb(120, 245, 255);
  --hielo: rgb(205, 240, 255);
  --rojo: rgb(255, 90, 80);
  --ambar: rgb(255, 170, 60);
  --verde: rgb(90, 220, 120);
  --casco: rgb(228, 228, 245);
  --panel: rgba(8, 10, 24, 0.86);
  --borde: rgba(168, 162, 232, 0.3);
  --mono: 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--negro); color: var(--ink); font-family: var(--mono); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; background: var(--negro); }
#stage { position: relative; flex: none; background: var(--negro); overflow: hidden; }
#stage.tiembla { animation: tiembla 0.14s infinite; }
@keyframes tiembla { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 3px); } }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; display: block; }
#hud { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; font-size: 15px; line-height: 1.45; }
#hud > * { pointer-events: auto; }
#hud button { font-family: var(--mono); }
[hidden] { display: none !important; }

/* día y recorrido de 14 días */
.top { position: absolute; left: 16px; top: 10px; display: flex; align-items: center; gap: 16px; padding: 6px 10px; }
#h-dia { font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; min-width: 200px; }
#h-dia small { display: block; font-weight: 400; color: var(--dim); letter-spacing: 0.04em; font-size: 11px; }
#h-track { display: flex; gap: 4px; }
.dia { width: 28px; height: 28px; border: 1px solid var(--borde); display: grid; place-items: center; font-size: 11px; color: var(--faint); position: relative; background: rgba(8, 10, 24, 0.6); }
.dia.noche { background: rgba(24, 28, 90, 0.6); }
.dia.pasado { color: var(--dim); border-color: rgba(168, 162, 232, 0.55); }
.dia.hoy { color: var(--negro); background: var(--crema); border-color: var(--crema); font-weight: 700; }
.dia i { position: absolute; bottom: -7px; width: 6px; height: 6px; border-radius: 50%; }
.dia i.ll { left: 4px; background: var(--cian); }
.dia i.av { left: 12px; background: var(--rojo); }
.dia i.ev { right: 4px; background: var(--crema); border-radius: 0; transform: rotate(45deg); }

.panel { background: var(--panel); border: 1px solid var(--borde); }
.panel h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.16em; color: var(--dim); font-weight: 400; display: flex; justify-content: space-between; }

/* sistemas (arriba a la izquierda) */
.izq { position: absolute; left: 16px; top: 64px; width: 262px; padding: 12px; box-sizing: border-box; }
.barra { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin-bottom: 9px; position: relative; }
.barra .lbl { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
.barra .lbl small { letter-spacing: 0; font-size: 10px; color: var(--faint); }
.barra .val { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.barra .ascii { grid-column: 1 / -1; font-size: 12.5px; white-space: pre; }
.barra .delta { position: absolute; right: 40px; top: -2px; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
.barra .delta.on { opacity: 1; }
.barra.pulsa .ascii { animation: pulso 0.6s ease 2; }
@keyframes pulso { 50% { filter: brightness(1.8); } }
.z-verde { color: var(--verde); } .z-amarillo { color: var(--ambar); } .z-rojo { color: var(--rojo); }
.bueno { color: var(--verde); } .malo { color: var(--rojo); }
#extra { border-top: 1px dashed var(--borde); padding-top: 8px; font-size: 12px; color: var(--dim); display: grid; gap: 4px; }
#extra b { color: var(--ink); font-weight: 700; }

/* cartas (arriba a la derecha) */
.der { position: absolute; right: 16px; top: 64px; width: 262px; padding: 12px; box-sizing: border-box; }
#cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.carta { text-align: left; background: rgba(20, 22, 50, 0.9); border: 1px solid var(--borde); color: var(--ink); padding: 5px 6px; min-height: 44px; cursor: pointer; font-size: 11px; line-height: 1.25; display: flex; flex-direction: column; gap: 2px; }
.carta small { color: var(--dim); font-size: 10px; }
.carta.bloq { color: var(--faint); cursor: default; border-style: dashed; background: rgba(10, 12, 24, 0.6); }
.carta.usada { opacity: 0.38; cursor: default; }
.carta.armada { border-color: var(--hielo); box-shadow: 0 0 0 1px var(--hielo), 0 0 14px rgba(205, 240, 255, 0.35); }
.carta.nueva { animation: brillo 1.2s ease 3; }
@keyframes brillo { 50% { border-color: var(--crema); box-shadow: 0 0 16px rgba(255, 246, 225, 0.45); } }
.carta:focus-visible, .op:focus-visible, #ctrl button:focus-visible, .mj button:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }
.mini { font-size: 10.5px; color: var(--dim); margin: 8px 0 0; line-height: 1.35; }

/* consola (abajo al centro, para que se vea la escena) */
#consola { position: absolute; left: 294px; width: 692px; bottom: 14px; max-height: 360px; overflow: auto; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.tag { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); }
.tag.llamada { color: var(--cian); }
.tag.alarma { color: var(--rojo); animation: parpadeo 0.9s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0.35; } }
.titulo { font-size: 22px; font-weight: 700; color: var(--crema); margin: 0; line-height: 1.2; }
.txt { margin: 0; font-size: 16px; }
.sub { margin: 0; font-size: 12.5px; color: var(--dim); }
.paso { font-size: 11px; letter-spacing: 0.12em; color: var(--hielo); margin-top: 2px; }
.ops { display: flex; flex-wrap: wrap; gap: 8px; }
.ops.col { flex-direction: column; }
.op { background: rgba(34, 36, 80, 0.8); border: 1px solid var(--borde); color: var(--ink); padding: 8px 12px; font-size: 14.5px; text-align: left; cursor: pointer; }
.op:hover:not([disabled]) { border-color: var(--crema); }
.op.prim { background: var(--crema); color: var(--negro); border-color: var(--crema); font-weight: 700; }
.op.ok { border-color: var(--verde); color: var(--verde); }
.op.ko { border-color: var(--rojo); color: var(--rojo); text-decoration: line-through; }
.op.mal { border-color: var(--rojo); color: var(--rojo); }
.op.elegida { box-shadow: 0 0 0 2px var(--crema); }
.op[disabled] { cursor: default; }
.pista { font-size: 14.5px; padding: 3px 0 3px 10px; border-left: 2px solid var(--faint); }
.pista.clave { border-left-color: var(--hielo); color: var(--hielo); }
.res { font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--borde); }
.res.ok { border-color: var(--verde); }
.res.ko { border-color: var(--rojo); }
.estrellas { color: var(--ambar); letter-spacing: 0.2em; font-size: 28px; }
.grande { font-size: 52px; font-weight: 700; letter-spacing: 0.12em; color: var(--crema); text-align: center; margin: 10px 0 0; }

/* minijuegos (ventana central) */
#mj { position: absolute; left: 294px; width: 692px; top: 64px; max-height: 642px; overflow: auto; padding: 14px 18px; box-sizing: border-box; }
.mj { display: grid; gap: 10px; }
.mj-cab { display: grid; gap: 4px; }
.mj-tag { font-size: 11px; letter-spacing: 0.16em; color: var(--ambar); }
.mj-tit { margin: 0; font-size: 21px; color: var(--crema); }
.mj-tit2 { margin: 0; font-size: 18px; color: var(--crema); font-weight: 700; }
.mj-ins { margin: 0; font-size: 13.5px; color: var(--dim); }
.mj-ins b { color: var(--ink); }
.mj-tiempo { height: 6px; background: rgba(168, 162, 232, 0.18); }
.mj-tiempo i { display: block; height: 100%; width: 100%; background: var(--ambar); transition: width 0.1s linear; }
.mj-estado { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--hielo); }
.mj-estado.ok { color: var(--verde); } .mj-estado.ko { color: var(--rojo); }
.mj-cuerpo { display: grid; gap: 10px; }
.mj button { font-family: var(--mono); }
.mj-botones { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mj-botones button { min-width: 54px; min-height: 44px; background: rgba(34, 36, 80, 0.9); border: 1px solid var(--borde); color: var(--ink); font-size: 18px; cursor: pointer; }
.mj-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.mj-opciones.col { flex-direction: column; }
.mj-hechos { margin: 0; padding-left: 22px; color: var(--verde); font-size: 14px; display: grid; gap: 2px; }
.mj-cables { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
.mj-cables .col { display: grid; gap: 8px; }
.cable { background: rgba(20, 22, 50, 0.9); border: 2px solid var(--c); color: var(--c); padding: 10px; font-size: 15px; cursor: pointer; text-align: left; }
.cable[data-r] { text-align: right; }
.cable.sel { background: var(--c); color: var(--negro); }
.cable.ok { opacity: 0.45; border-style: dashed; }
.cable.mal { animation: sacude 0.3s; }
@keyframes sacude { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.mj-panel { display: grid; gap: 2px; touch-action: none; user-select: none; background: rgb(20, 30, 70); padding: 6px; }
.celda { aspect-ratio: 1.4; display: grid; place-items: center; font-size: 14px; cursor: crosshair; }
.celda.polvo { background: rgb(120, 112, 170); color: rgb(70, 64, 110); }
.celda.limpia { background: rgb(70, 125, 245); color: rgb(150, 190, 255); }
.celda.raya { background: rgb(150, 60, 70); color: var(--crema); }
.mj-carriles, .mj-laberinto, .mj-crater, .mj-paredes, .mj-buscar { display: grid; gap: 2px; user-select: none; }
.carril { height: 34px; display: grid; place-items: center; background: rgba(20, 22, 50, 0.8); color: var(--ambar); font-size: 18px; cursor: pointer; }
.carril.plataforma { color: var(--cian); }
.lab { aspect-ratio: 1; display: grid; place-items: center; font-size: 18px; color: var(--crema); background: rgba(40, 42, 90, 0.5); box-sizing: border-box; cursor: pointer; }
.lab.oscuro { background: rgb(4, 5, 12); color: transparent; }
.mj-laberinto { gap: 0; max-width: 560px; margin: 0 auto; width: 100%; }
.pared-c { aspect-ratio: 1.6; background: rgba(150, 158, 205, 0.25); border: 1px solid var(--borde); color: var(--dim); font-size: 18px; cursor: pointer; }
.pared-c.hoyo { background: rgb(10, 10, 20); color: var(--rojo); border-color: var(--rojo); }
.b-c { aspect-ratio: 1.2; background: rgba(20, 50, 30, 0.6); border: 1px solid rgba(90, 220, 120, 0.3); color: var(--verde); font-size: 18px; cursor: pointer; }
.fuga .b-c { background: rgba(20, 30, 70, 0.6); border-color: rgba(70, 150, 255, 0.35); color: rgb(110, 170, 255); }
.b-c.ok { background: var(--verde); color: var(--negro); }
.b-c.mal { border-color: var(--rojo); color: var(--rojo); }
.cr { aspect-ratio: 1; display: grid; place-items: center; background: rgb(6, 7, 16); color: var(--cian); font-size: 15px; }
.cr.visto { background: rgba(80, 76, 150, 0.45); }
.mj-medidor { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); }
.mj-medidor .pista { position: relative; height: 34px; background: linear-gradient(90deg, rgb(70, 150, 255), rgb(150, 158, 205), rgb(255, 120, 70)); border: 1px solid var(--borde); padding: 0; }
.mj-medidor .zona { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--verde); background: rgba(90, 220, 120, 0.25); }
.mj-medidor .aguja { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; background: var(--crema); }
.mj-datos ul { margin: 6px 0; padding-left: 18px; font-size: 14px; }
.mj-barras { display: flex; gap: 10px; align-items: flex-end; height: 150px; padding: 6px 0; border-bottom: 1px solid var(--borde); }
.mj-barras .mb { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
.mj-barras .mb i { width: 100%; display: block; }
.interruptor.off { color: var(--faint); }

/* aviso */
#toast { position: absolute; right: 16px; bottom: 14px; width: 262px; font-size: 12.5px; padding: 10px 12px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--crema); color: var(--crema); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
#toast.on { opacity: 1; }

/* herramientas del equipo (fuera del juego, plegadas) */
#ctrl { width: 100%; box-sizing: border-box; background: rgb(8, 9, 18); border-top: 1px solid rgba(168, 162, 232, 0.18); font-size: 12px; color: var(--dim); }
#ctrl summary { cursor: pointer; padding: 6px max(16px, env(safe-area-inset-left, 0px)); color: var(--faint); list-style: none; text-align: center; }
#ctrl summary::-webkit-details-marker { display: none; }
#ctrl[open] summary { color: var(--dim); }
.ctl-wrap { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center; max-height: 34vh; overflow: auto; }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl button { background: transparent; border: 1px solid rgba(168, 162, 232, 0.3); color: var(--dim); font: 12px var(--mono); padding: 5px 9px; cursor: pointer; }
.ctl button[aria-pressed="true"] { background: var(--crema); color: var(--negro); border-color: var(--crema); }
.ctl input[type=range] { width: 90px; accent-color: var(--crema); }
.ctl output { color: var(--ink); min-width: 32px; }
.ctl select { background: rgb(18, 20, 36); color: var(--ink); border: 1px solid rgba(168, 162, 232, 0.3); font: 12px var(--mono); padding: 3px 4px; }
.ctl.ancho { flex-basis: 100%; justify-content: center; color: var(--faint); }
.ctl.ancho output { color: var(--hielo); }
#log { flex-basis: 100%; font-size: 11.5px; color: var(--faint); display: grid; gap: 1px; text-align: center; }
#log div:last-child { color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .tag.alarma, .carta.nueva, .barra.pulsa .ascii, #stage.tiembla, .cable.mal { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="juego" width="2560" height="1440" aria-label="G-NOSIS: la Luna y la base dibujadas en ASCII"></canvas>
    <div id="hud" hidden>
      <div class="top panel"><div id="h-dia"></div><div id="h-track" aria-label="Días de la misión"></div></div>
      <aside class="izq panel" aria-label="Sistemas de la base">
        <h3><span>SISTEMAS</span></h3>
        <div id="barras"></div>
        <div id="extra"></div>
      </aside>
      <aside class="der panel" aria-label="Cartas">
        <h3><span>CARTAS</span><span id="n-cartas"></span></h3>
        <div id="cartas"></div>
        <p class="mini">Toca una carta para usarla. Escudo: frena la mitad del próximo daño a esa barra. Recurso: suma al instante.</p>
      </aside>
      <section id="consola" class="panel" aria-live="polite"></section>
      <section id="mj" class="panel" aria-live="polite" hidden></section>
      <div id="toast" role="status"></div>
    </div>
  </div>
  <details id="ctrl">
    <summary id="equipo-sum">herramientas del equipo</summary>
    <div class="ctl-wrap" id="equipo">
      <div class="ctl" role="group" aria-label="Dónde se juega"><span>Uso</span>
        <button type="button" data-uso="libre">Libre</button><button type="button" data-uso="educativo">Salón</button>
        <label for="c-grado" id="l-grado" hidden>grado <select id="c-grado"><option value="1">1°</option><option value="2">2°</option><option value="3">3°</option><option value="4">4°</option><option value="5">5°</option><option value="6">6°</option></select></label></div>
      <div class="ctl" role="group" aria-label="Modo"><span>Modo</span>
        <button type="button" data-modo="manual">Tú juegas</button><button type="button" data-modo="auto">Automático</button></div>
      <div class="ctl" role="group" aria-label="Velocidad"><span>Velocidad</span>
        <button type="button" data-vel="1">1×</button><button type="button" data-vel="2">2×</button><button type="button" data-vel="4">4×</button></div>
      <label class="ctl" for="c-hab">Habilidad <input id="c-hab" type="range" min="10" max="100" step="5" value="70"><output id="o-hab">70%</output></label>
      <label class="ctl" for="c-comp">Comprensión <input id="c-comp" type="range" min="10" max="100" step="5" value="65"><output id="o-comp">65%</output></label>
      <div class="ctl"><button type="button" id="c-voz" aria-pressed="false">Voz en off (lectura 1)</button></div>
      <div class="ctl"><button type="button" id="c-reiniciar">Nueva partida</button><button type="button" id="c-menu">Menú</button><button type="button" id="c-borrar">Borrar progreso</button></div>
      <div class="ctl" role="group" aria-label="Ver un final"><span>Finales</span>
        <button type="button" data-final="perfecta">3★</button><button type="button" data-final="verde">2★</button><button type="button" data-final="relevo">1★</button>
        <button type="button" data-final="apagon">apagón</button><button type="button" data-final="despensa">despensa</button><button type="button" data-final="radiacion">radiación</button><button type="button" data-final="agotado">agotado</button></div>
      <div class="ctl ancho" aria-live="polite"><span>Solo el equipo lo ve:</span><output id="c-equipo">—</output></div>
      <div class="ctl ancho"><span>Datos:</span><output id="c-apis">—</output></div>
      <div id="log" aria-label="Bitácora"></div>
    </div>
  </details>
</div>

<script src="js/luna.js"></script>
<script src="js/espacio.js"></script>
<script src="js/nave.js"></script>
<script src="js/musica.js"></script>
<script src="js/musica-base.js"></script>
<script src="js/finales.js"></script>
<script src="js/datos.js"></script>
<script src="js/escenas.js"></script>
<script src="js/apis.js"></script>
<script src="js/minijuegos.js"></script>
<script src="js/juego.js"></script>
</body>
</html>

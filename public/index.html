<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-NOSIS</title>
<meta name="description" content="G-NOSIS: sobrevive 14 días en una base lunar. Juego educativo para niños de 7 a 12 años con datos reales de la NASA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* G-NOSIS: lienzo ASCII 16:9 (intro, base y finales) con el HUD de la base encima, y debajo las herramientas del equipo, plegadas. Un solo look oscuro, el de la intro. */
:root {
  --negro: rgb(0, 0, 0);
  --ink: rgb(235, 240, 255);
  --dim: rgb(150, 156, 185);
  --faint: rgb(84, 90, 124);
  --crema: rgb(255, 246, 225);
  --lila: rgb(168, 162, 232);
  --cian: rgb(120, 245, 255);
  --hielo: rgb(205, 240, 255);
  --rojo: rgb(255, 90, 80);
  --ambar: rgb(255, 170, 60);
  --verde: rgb(90, 220, 120);
  --casco: rgb(228, 228, 245);
  --panel: rgba(8, 10, 24, 0.86);
  --borde: rgba(168, 162, 232, 0.3);
  --mono: 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--negro); color: var(--ink); font-family: var(--mono); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; background: var(--negro); }
#stage { position: relative; flex: none; background: var(--negro); overflow: hidden; }
#stage.tiembla { animation: tiembla 0.14s infinite; }
@keyframes tiembla { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 3px); } }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; display: block; }
#hud { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; font-size: 15px; line-height: 1.45; }
#hud > * { pointer-events: auto; }
#hud button { font-family: var(--mono); }
[hidden] { display: none !important; }

/* día y recorrido de 14 días */
.top { position: absolute; left: 12px; top: 6px; right: 300px; display: flex; align-items: center; gap: 12px; }
/* panel de día (sprite): el texto y la luna van encima, en % del sprite (img/hud/sprites.json) */
#h-dia { position: relative; width: 150px; flex: none; line-height: 1; }
#h-dia img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
#h-dia .dia-txt { position: absolute; left: 44%; top: 11.9%; width: 47.9%; height: 67.3%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
#h-dia .dia-txt small { font-size: 12px; font-weight: 700; color: var(--casco); letter-spacing: 0.1em; }
#h-dia .dia-txt b { font-size: 26px; font-weight: 700; color: var(--ambar); letter-spacing: 0.04em; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5); }
#h-dia .luna { position: absolute; left: 14.5%; top: 24%; width: 24%; height: 50%; background: rgb(14, 16, 40); display: none; }
#h-dia .luna::after { content: ""; position: absolute; left: 22%; top: 18%; width: 56%; height: 64%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgb(235, 238, 255), rgb(170, 175, 215) 60%, rgb(120, 125, 175)); box-shadow: inset -6px -2px 0 rgba(14, 16, 40, 0.55); }
#h-dia.noche .luna { display: block; }
#h-fase { position: absolute; left: 16px; top: 88px; font-size: 10.5px; color: var(--dim); letter-spacing: 0.05em; white-space: nowrap; }
/* botón del libro (bitácora) */
#btn-bitacora { position: relative; flex: none; width: 66px; padding: 0; background: none; border: 0; cursor: pointer; }
#btn-bitacora img { display: block; width: 100%; height: auto; image-rendering: pixelated; transition: transform 0.15s; }
#btn-bitacora:hover img { transform: translateY(-2px) rotate(-3deg); }
#btn-bitacora:focus-visible { outline: 2px solid var(--crema); outline-offset: 3px; }
#bitacora-nuevos { position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--rojo); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; box-sizing: border-box; }

.panel { background: var(--panel); border: 1px solid var(--borde); }
.panel h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.16em; color: var(--dim); font-weight: 400; display: flex; justify-content: space-between; }

/* sistemas (arriba a la izquierda) */
/* abajo a la izquierda, para dejar libre la vista de la base */
.izq { position: absolute; left: 16px; bottom: 14px; width: 262px; padding: 8px 6px; box-sizing: border-box; }
.izq h3 { padding: 0 6px; }
/* barra = sprite de 760x160 (img/hud/barra-*.png); 10 segmentos de 10 puntos.
   Debajo la barra vacía y encima la llena, recortada con clip-path en el hueco entre segmentos (juego.js) */
.barra { margin-bottom: 3px; }
.barra .marco { position: relative; }
.barra img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.barra img.llena { position: absolute; left: 0; top: 0; transition: clip-path 0.35s steps(4); }
.barra .lbl { display: block; padding-left: 24%; margin-bottom: -6px; position: relative; z-index: 1; font-size: 9.5px; letter-spacing: 0.12em; color: var(--casco); text-shadow: 1px 1px 0 #000; }
.barra .delta { position: absolute; right: 4%; top: 30%; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity 0.3s; text-shadow: 1px 1px 0 #000; }
.barra .delta.on { opacity: 1; }
.barra.pulsa img { animation: pulso 0.6s ease 2; }
.barra.z-rojo img { animation: alerta-barra 0.9s steps(2) infinite; }
@keyframes alerta-barra { 50% { filter: brightness(1.5) drop-shadow(0 0 6px rgb(255, 80, 70)); } }
@keyframes pulso { 50% { filter: brightness(1.8); } }
.z-verde { color: var(--verde); } .z-amarillo { color: var(--ambar); } .z-rojo { color: var(--rojo); }
.bueno { color: var(--verde); } .malo { color: var(--rojo); }
#extra { border-top: 1px dashed var(--borde); padding-top: 8px; font-size: 12px; color: var(--dim); display: grid; gap: 4px; }
#extra b { color: var(--ink); font-weight: 700; }

/* cartas: botón compacto arriba a la derecha que abre y cierra el panel (antes ocupaba la columna entera) */
#btn-cartas { position: absolute; right: 16px; top: 96px; height: 28px; box-sizing: border-box; border-style: solid; border-color: transparent; border-width: 0 20px; border-image: url(img/dialogo/etiqueta-normal.png) 0 20 fill / 0 20px / 0 stretch; image-rendering: pixelated; background: none; padding: 0 2px 3px 8px; display: inline-flex; align-items: center; gap: 8px; font: 700 12px var(--mono); letter-spacing: 0.14em; color: rgb(24, 22, 58); cursor: pointer; }
#btn-cartas b { letter-spacing: 0.04em; }
#btn-cartas .flecha { transition: transform 0.2s; }
#btn-cartas[aria-expanded="true"] .flecha { transform: rotate(180deg); }
#btn-cartas:hover, #btn-cartas:focus-visible { filter: brightness(1.12); outline: none; }
#btn-cartas.nueva { animation: carta-nueva 0.7s steps(2) 6; }
@keyframes carta-nueva { 50% { filter: brightness(1.5) drop-shadow(0 0 8px rgb(255, 246, 225)); } }
#btn-cartas.armada::after { content: "ESCUDO LISTO"; position: absolute; right: 0; top: 30px; font-size: 9.5px; letter-spacing: 0.1em; color: var(--hielo); white-space: nowrap; }
.der { position: absolute; right: 16px; top: 132px; width: 262px; padding: 4px 8px 8px; box-sizing: border-box; z-index: 3; background: none; border: 16px solid transparent; border-image: url(img/dialogo/panel-normal.png) 32 fill / 32px / 0 stretch; image-rendering: pixelated; }
#cerrar-cartas { background: none; border: 0; color: var(--dim); font: 700 13px var(--mono); cursor: pointer; padding: 0 2px; }
#cerrar-cartas:hover { color: var(--crema); }
#cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.carta { text-align: left; background: rgba(20, 22, 50, 0.9); border: 1px solid var(--borde); color: var(--ink); padding: 5px 6px; min-height: 44px; cursor: pointer; font-size: 11px; line-height: 1.25; display: flex; flex-direction: column; gap: 2px; }
.carta small { color: var(--dim); font-size: 10px; }
.carta.bloq { color: var(--faint); cursor: default; border-style: dashed; background: rgba(10, 12, 24, 0.6); }
.carta.usada { opacity: 0.38; cursor: default; }
.carta.armada { border-color: var(--hielo); box-shadow: 0 0 0 1px var(--hielo), 0 0 14px rgba(205, 240, 255, 0.35); }
.carta.nueva { animation: brillo 1.2s ease 3; }
@keyframes brillo { 50% { border-color: var(--crema); box-shadow: 0 0 16px rgba(255, 246, 225, 0.45); } }
.carta:focus-visible, .op:focus-visible, #ctrl button:focus-visible, .mj button:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }
.mini { font-size: 10.5px; color: var(--dim); margin: 8px 0 0; line-height: 1.35; }

/* consola (abajo al centro, para que se vea la escena) */
#consola { position: absolute; left: 294px; width: 692px; bottom: 14px; max-height: 360px; overflow: auto; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.tag { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); }
.tag.llamada { color: var(--cian); }
.tag.alarma { color: var(--rojo); animation: parpadeo 0.9s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0.35; } }
.titulo { font-size: 22px; font-weight: 700; color: var(--crema); margin: 0; line-height: 1.2; }
.txt { margin: 0; font-size: 16px; }
.sub { margin: 0; font-size: 12.5px; color: var(--dim); }
.paso { font-size: 11px; letter-spacing: 0.12em; color: var(--hielo); margin-top: 2px; }
.ops { display: flex; flex-wrap: wrap; gap: 8px; }
.ops.col { flex-direction: column; }
.op { background: rgba(34, 36, 80, 0.8); border: 1px solid var(--borde); color: var(--ink); padding: 8px 12px; font-size: 14.5px; text-align: left; cursor: pointer; }
.op:hover:not([disabled]) { border-color: var(--crema); }
.op.prim { background: var(--crema); color: var(--negro); border-color: var(--crema); font-weight: 700; }
.op.ok { border-color: var(--verde); color: var(--verde); }
.op.ko { border-color: var(--rojo); color: var(--rojo); text-decoration: line-through; }
.op.mal { border-color: var(--rojo); color: var(--rojo); }
.op.elegida { box-shadow: 0 0 0 2px var(--crema); }
.op[disabled] { cursor: default; }
.pista { font-size: 14.5px; padding: 3px 0 3px 10px; border-left: 2px solid var(--faint); }
.pista.clave { border-left-color: var(--hielo); color: var(--hielo); }
.res { font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--borde); }
.res.ok { border-color: var(--verde); }
.res.ko { border-color: var(--rojo); }
.estrellas { color: var(--ambar); letter-spacing: 0.2em; font-size: 28px; }
.grande { font-size: 52px; font-weight: 700; letter-spacing: 0.12em; color: var(--crema); text-align: center; margin: 10px 0 0; }

/* minijuegos (ventana central) */
#mj { position: absolute; left: 294px; width: 692px; top: 96px; max-height: 610px; overflow: auto; padding: 14px 18px; box-sizing: border-box; }
.mj { display: grid; gap: 10px; }
.mj-cab { display: grid; gap: 4px; }
.mj-tag { font-size: 11px; letter-spacing: 0.16em; color: var(--ambar); }
.mj-tit { margin: 0; font-size: 21px; color: var(--crema); }
.mj-tit2 { margin: 0; font-size: 18px; color: var(--crema); font-weight: 700; }
.mj-ins { margin: 0; font-size: 13.5px; color: var(--dim); }
.mj-ins b { color: var(--ink); }
.mj-tiempo { height: 6px; background: rgba(168, 162, 232, 0.18); }
.mj-tiempo i { display: block; height: 100%; width: 100%; background: var(--ambar); transition: width 0.1s linear; }
.mj-estado { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--hielo); }
.mj-estado.ok { color: var(--verde); } .mj-estado.ko { color: var(--rojo); }
.mj-cuerpo { display: grid; gap: 10px; }
.mj button { font-family: var(--mono); }
.mj-botones { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mj-botones button { min-width: 54px; min-height: 44px; background: rgba(34, 36, 80, 0.9); border: 1px solid var(--borde); color: var(--ink); font-size: 18px; cursor: pointer; }
.mj-opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.mj-opciones.col { flex-direction: column; }
.mj-hechos { margin: 0; padding-left: 22px; color: var(--verde); font-size: 14px; display: grid; gap: 2px; }
.mj-cables { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
.mj-cables .col { display: grid; gap: 8px; }
.cable { background: rgba(20, 22, 50, 0.9); border: 2px solid var(--c); color: var(--c); padding: 10px; font-size: 15px; cursor: pointer; text-align: left; }
.cable[data-r] { text-align: right; }
.cable.sel { background: var(--c); color: var(--negro); }
.cable.ok { opacity: 0.45; border-style: dashed; }
.cable.mal { animation: sacude 0.3s; }
@keyframes sacude { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.mj-panel { display: grid; gap: 2px; touch-action: none; user-select: none; background: rgb(20, 30, 70); padding: 6px; }
.celda { aspect-ratio: 1.4; display: grid; place-items: center; font-size: 14px; cursor: crosshair; }
.celda.polvo { background: rgb(120, 112, 170); color: rgb(70, 64, 110); }
.celda.limpia { background: rgb(70, 125, 245); color: rgb(150, 190, 255); }
.celda.raya { background: rgb(150, 60, 70); color: var(--crema); }
.mj-carriles, .mj-laberinto, .mj-crater, .mj-paredes, .mj-buscar { display: grid; gap: 2px; user-select: none; }
.carril { height: 34px; display: grid; place-items: center; background: rgba(20, 22, 50, 0.8); color: var(--ambar); font-size: 18px; cursor: pointer; }
.carril.plataforma { color: var(--cian); }
.lab { aspect-ratio: 1; display: grid; place-items: center; font-size: 18px; color: var(--crema); background: rgba(40, 42, 90, 0.5); box-sizing: border-box; cursor: pointer; }
.lab.oscuro { background: rgb(4, 5, 12); color: transparent; }
.mj-laberinto { gap: 0; max-width: 560px; margin: 0 auto; width: 100%; }
.pared-c { aspect-ratio: 1.6; background: rgba(150, 158, 205, 0.25); border: 1px solid var(--borde); color: var(--dim); font-size: 18px; cursor: pointer; }
.pared-c.hoyo { background: rgb(10, 10, 20); color: var(--rojo); border-color: var(--rojo); }
.b-c { aspect-ratio: 1.2; background: rgba(20, 50, 30, 0.6); border: 1px solid rgba(90, 220, 120, 0.3); color: var(--verde); font-size: 18px; cursor: pointer; }
.fuga .b-c { background: rgba(20, 30, 70, 0.6); border-color: rgba(70, 150, 255, 0.35); color: rgb(110, 170, 255); }
.b-c.ok { background: var(--verde); color: var(--negro); }
.b-c.mal { border-color: var(--rojo); color: var(--rojo); }
.cr { aspect-ratio: 1; display: grid; place-items: center; background: rgb(6, 7, 16); color: var(--cian); font-size: 15px; }
.cr.visto { background: rgba(80, 76, 150, 0.45); }
.mj-medidor { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); }
.mj-medidor .pista { position: relative; height: 34px; background: linear-gradient(90deg, rgb(70, 150, 255), rgb(150, 158, 205), rgb(255, 120, 70)); border: 1px solid var(--borde); padding: 0; }
.mj-medidor .zona { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--verde); background: rgba(90, 220, 120, 0.25); }
.mj-medidor .aguja { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; background: var(--crema); }
.mj-datos ul { margin: 6px 0; padding-left: 18px; font-size: 14px; }
.mj-barras { display: flex; gap: 10px; align-items: flex-end; height: 150px; padding: 6px 0; border-bottom: 1px solid var(--borde); }
.mj-barras .mb { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
.mj-barras .mb i { width: 100%; display: block; }
.interruptor.off { color: var(--faint); }
/* "así se juega": instrucciones cortas + demo animada antes de empezar */
.mj-demo { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: center; }
.mj-demo img { width: 320px; height: 192px; image-rendering: pixelated; border: 3px solid var(--tema, var(--lila)); box-shadow: 0 0 0 2px rgb(24, 22, 52); background: rgb(10, 12, 28); }
.mj-pasos { margin: 0; padding: 0; list-style: none; counter-reset: paso; display: grid; gap: 12px; font-size: 16px; line-height: 1.35; }
.mj-pasos li { counter-increment: paso; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; }
.mj-pasos li::before { content: counter(paso); display: grid; place-items: center; width: 24px; height: 24px; background: var(--tema, var(--lila)); color: rgb(24, 22, 58); font-weight: 700; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.3); }
.mj-intro .ops { justify-content: flex-end; }

/* aviso */
#toast { position: absolute; right: 16px; bottom: 14px; width: 262px; font-size: 12.5px; padding: 10px 12px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--crema); color: var(--crema); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
#toast.on { opacity: 1; }

/* herramientas del equipo (fuera del juego, plegadas) */
#ctrl { width: 100%; box-sizing: border-box; background: rgb(8, 9, 18); border-top: 1px solid rgba(168, 162, 232, 0.18); font-size: 12px; color: var(--dim); }
#ctrl summary { cursor: pointer; padding: 6px max(16px, env(safe-area-inset-left, 0px)); color: var(--faint); list-style: none; text-align: center; }
#ctrl summary::-webkit-details-marker { display: none; }
#ctrl[open] summary { color: var(--dim); }
.ctl-wrap { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center; max-height: 34vh; overflow: auto; }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl button { background: transparent; border: 1px solid rgba(168, 162, 232, 0.3); color: var(--dim); font: 12px var(--mono); padding: 5px 9px; cursor: pointer; }
.ctl button[aria-pressed="true"] { background: var(--crema); color: var(--negro); border-color: var(--crema); }
.ctl input[type=range] { width: 90px; accent-color: var(--crema); }
.ctl output { color: var(--ink); min-width: 32px; }
.ctl select { background: rgb(18, 20, 36); color: var(--ink); border: 1px solid rgba(168, 162, 232, 0.3); font: 12px var(--mono); padding: 3px 4px; }
.ctl.ancho { flex-basis: 100%; justify-content: center; color: var(--faint); }
.ctl.ancho output { color: var(--hielo); }
#log { flex-basis: 100%; font-size: 11.5px; color: var(--faint); display: grid; gap: 1px; text-align: center; }
#log div:last-child { color: var(--dim); }
/* retratos que hablan: dos cuadros lado a lado en un jpg (img/personajes/) */
.con-retrato { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
.con-retrato > .cuerpo { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.retrato { width: 92px; height: 105px; background-size: 200% 100%; background-position: 0 0; image-rendering: pixelated; border: 2px solid var(--borde); box-sizing: border-box; background-color: #07070c; }
.retrato.cientifica { background-image: url(img/personajes/cientifica.jpg); }
.retrato.control { background-image: url(img/personajes/control-mision.jpg); }
.retrato.boca { background-position: 100% 0; }
.retrato-nombre { font-size: 10px; color: var(--dim); text-align: center; margin-top: 3px; letter-spacing: 0.06em; }
/* bitácora: el libro abierto ocupa la pantalla */
#bitacora { position: absolute; inset: 0; background: rgba(2, 3, 10, 0.78); display: grid; place-items: center; z-index: 5; }
.bt-libro { position: relative; width: 1000px; aspect-ratio: 1056 / 708; background: url(img/hud/bitacora-libro.png) center / 100% 100% no-repeat; image-rendering: pixelated; color: rgb(40, 36, 64); margin-top: 30px; }
.bt-pag { position: absolute; top: 7.5%; height: 82%; width: 36.5%; overflow: auto; font-size: 14px; line-height: 1.45; padding-right: 6px; }
.bt-pag.izq-p { left: 5.5%; } .bt-pag.der-p { left: 57.5%; }
.bt-pag p { margin: 0 0 9px; }
.bt-tit { margin: 0 0 8px; font-size: 17px; color: rgb(60, 40, 120); border-bottom: 2px dashed rgba(60, 40, 120, 0.25); padding-bottom: 4px; }
.bt-frase { font-size: 16px; font-weight: 700; color: rgb(150, 50, 70); }
.bt-mini { font-size: 12px; color: rgb(110, 100, 130); }
.bt-vacio { color: rgb(130, 120, 150); font-style: italic; }
.bt-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.bt-item { width: 100%; text-align: left; background: rgba(60, 40, 120, 0.06); border: 1px solid rgba(60, 40, 120, 0.18); color: inherit; font: inherit; font-size: 13.5px; padding: 5px 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.bt-item small { color: rgb(120, 110, 140); font-size: 11px; }
.bt-item.sel { background: rgba(60, 40, 120, 0.16); border-color: rgb(60, 40, 120); }
.bt-item.bloq { opacity: 0.45; cursor: default; }
.bt-datos { margin: 0 0 8px; padding-left: 18px; display: grid; gap: 4px; }
.bt-datos a { color: rgb(40, 80, 170); }
.bt-grafica { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 2px solid rgba(60, 40, 120, 0.3); margin-bottom: 6px; }
.bt-grafica i { flex: 1; min-height: 3px; }
.bt-pestanas { position: absolute; top: -34px; left: 6%; display: flex; gap: 6px; }
.bt-pestanas button { font: 700 13px var(--mono); padding: 7px 12px 9px; border: 2px solid rgb(30, 28, 70); border-bottom: 0; background: rgb(48, 44, 110); color: var(--casco); cursor: pointer; }
.bt-pestanas button[aria-pressed="true"] { background: rgb(253, 246, 226); color: rgb(60, 40, 120); }
#bt-cerrar { position: absolute; top: -34px; right: 4%; font: 700 13px var(--mono); padding: 7px 12px; background: var(--crema); color: var(--negro); border: 0; cursor: pointer; }
/* ===== cuadros de texto pixel art (img/dialogo; se generan con herramientas/generar-sprites-dialogo.py) =====
   Mismo estilo que las barras: marco biselado, pantalla hundida y tornillos. El color cambia con la tensión:
   tema-normal (lavanda) · tema-llamada (turquesa, calma) · tema-alerta (ámbar) · tema-catastrofe (rojo, late). */
#consola, #mj, #toast { background: none; border: 16px solid transparent; border-image: url(img/dialogo/panel-normal.png) 32 fill / 32px / 0 stretch; image-rendering: pixelated; --tema: rgb(152, 142, 224); }
#consola { padding: 6px 12px 8px; }
#mj { padding: 6px 12px 10px; }
#toast { padding: 0 4px 2px; }
#consola.tema-llamada, #mj.tema-llamada { border-image-source: url(img/dialogo/panel-llamada.png); --tema: rgb(84, 196, 212); }
#consola.tema-alerta, #mj.tema-alerta { border-image-source: url(img/dialogo/panel-alerta.png); --tema: rgb(238, 170, 62); }
#consola.tema-catastrofe, #mj.tema-catastrofe { border-image-source: url(img/dialogo/panel-catastrofe.png); --tema: rgb(222, 62, 62); animation: latido 1.1s ease-in-out infinite; }
@keyframes latido { 50% { filter: drop-shadow(0 0 12px rgba(255, 60, 50, 0.6)); } }
.tema-catastrofe .titulo { color: rgb(255, 214, 200); }
.tema-llamada .titulo { color: var(--hielo); }
/* etiqueta (LLEGADA, EVENTO, LLAMADA...) como placa pixel art */
.tag { align-self: flex-start; display: inline-flex; align-items: center; height: 24px; box-sizing: border-box; border-style: solid; border-color: transparent; border-width: 0 20px; border-image: url(img/dialogo/etiqueta-normal.png) 0 20 fill / 0 20px / 0 stretch; image-rendering: pixelated; padding: 0 2px 2px 6px; font-weight: 700; color: rgb(24, 22, 58); white-space: nowrap; }
.tema-llamada .tag, .tag.llamada { border-image-source: url(img/dialogo/etiqueta-llamada.png); color: rgb(10, 40, 60); }
.tema-alerta .tag { border-image-source: url(img/dialogo/etiqueta-alerta.png); color: rgb(50, 26, 8); }
.tema-catastrofe .tag, .tag.alarma { border-image-source: url(img/dialogo/etiqueta-catastrofe.png); color: rgb(255, 240, 232); padding-left: 14px; }
.tag.alarma { animation: parpadeo-tag 0.9s steps(2) infinite; }
@keyframes parpadeo-tag { 50% { filter: brightness(1.45); } }
/* botón principal crema (como "Conocer la base") */
.op.prim { background: none; border-style: solid; border-color: transparent; border-width: 0 12px; border-image: url(img/dialogo/boton.png) 0 12 fill / 0 12px / 0 stretch; image-rendering: pixelated; height: 28px; padding: 0 4px 3px; display: inline-flex; align-items: center; white-space: nowrap; color: rgb(24, 22, 58); }
.op.prim:hover:not([disabled]) { border-color: transparent; border-image-source: url(img/dialogo/boton-hover.png); }
.op.prim:active:not([disabled]) { border-image-source: url(img/dialogo/boton-presionado.png); padding: 3px 4px 0; }
/* opciones: botón oscuro con bisel de pixel; al pasar el mouse toma el color del tema */
.op:not(.prim) { background: rgb(30, 32, 70); border: 2px solid rgb(14, 13, 34); box-shadow: inset 2px 2px 0 rgba(198, 190, 250, 0.28), inset -2px -3px 0 rgba(6, 6, 20, 0.55); }
.op:not(.prim):hover:not([disabled]) { border-color: var(--tema, var(--crema)); }
.op.ok { border-color: var(--verde) !important; } .op.ko, .op.mal { border-color: var(--rojo) !important; }
.res { border-width: 2px; box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.06); }
/* retrato con el marco del color del tema */
.retrato { border: 3px solid var(--tema, var(--lila)); box-shadow: 0 0 0 2px rgb(24, 22, 52); }
.retrato-nombre { color: var(--tema, var(--dim)); font-weight: 700; }
.mj-tag { color: var(--tema, var(--ambar)); }
/* ===== franja inferior: barras e instrucciones van debajo de la escena, no encima =====
   El HUD mide 1280 x 960: arriba la escena (1280 x 720) se ve completa; abajo, en 240 px,
   el panel de sistemas (2 x 2 barras) y el cuadro de texto. ajustar() en juego.js reduce la escena para que quepa. */
#hud { height: 720px; }
#franja { position: absolute; left: 0; top: 464px; width: 1280px; height: 256px; background: rgb(8, 9, 20); box-shadow: inset 0 3px 0 rgb(152, 142, 224), inset 0 6px 0 rgb(74, 66, 142), inset 0 9px 0 rgb(14, 13, 34); pointer-events: none; }
.izq { left: 10px; top: 472px; bottom: auto; width: 500px; height: 242px; padding: 2px 8px 4px; background: none; border: 16px solid transparent; border-image: url(img/dialogo/panel-normal.png) 32 fill / 32px / 0 stretch; image-rendering: pixelated; }
.izq h3 { padding: 0; margin: 0 0 2px; }
.izq #extra { position: absolute; right: 2px; top: 1px; border: 0; padding: 0; font-size: 11px; }
#barras { margin-top: 10px; row-gap: 10px; }
.izq #extra span:not(:first-child) { display: none; }
#barras { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.barra { margin-bottom: 0; }
#consola { left: 522px; top: 470px; bottom: auto; width: 748px; height: 246px; max-height: none; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--tema, var(--lila)) transparent; }
#consola .titulo { font-size: 20px; }
#toast { bottom: 270px; }
@media (prefers-reduced-motion: reduce) { #consola.tema-catastrofe, #mj.tema-catastrofe, .tag.alarma, .carta.nueva, .barra.pulsa .ascii, #stage.tiembla, .cable.mal { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="juego" width="2560" height="1440" aria-label="G-NOSIS: la Luna y la base dibujadas en ASCII"></canvas>
    <div id="hud" hidden>
      <div id="franja" aria-hidden="true"></div>
      <div class="top">
        <div id="h-dia"><img src="img/hud/panel-dia.png" alt=""><span class="luna" aria-hidden="true"></span><span class="dia-txt"><small>DÍA</small><b id="h-num">00</b></span></div>
        <button type="button" id="btn-bitacora" title="Bitácora: lo que has descubierto" aria-label="Abrir la bitácora"><img src="img/hud/bitacora-icono.png" alt=""><span id="bitacora-nuevos" hidden>0</span></button>
      </div>
      <div id="h-fase"></div>
      <aside class="izq panel" aria-label="Sistemas de la base">
        <h3><span>SISTEMAS</span></h3>
        <div id="barras"></div>
        <div id="extra"></div>
      </aside>
      <button type="button" id="btn-cartas" aria-expanded="false" aria-controls="panel-cartas" title="Tus cartas de la Luna">CARTAS <b id="n-cartas-btn">0 / 10</b><span class="flecha" aria-hidden="true">▾</span></button>
      <aside class="der panel" id="panel-cartas" aria-label="Cartas" hidden>
        <h3><span>CARTAS</span><span id="n-cartas"></span><button type="button" id="cerrar-cartas" aria-label="Cerrar cartas">✕</button></h3>
        <div id="cartas"></div>
        <p class="mini">Toca una carta para usarla. Escudo: frena la mitad del próximo daño a esa barra. Recurso: suma al instante.</p>
      </aside>
      <section id="consola" class="panel" aria-live="polite"></section>
      <section id="bitacora" hidden aria-label="Bitácora">
        <div class="bt-libro">
          <div class="bt-pestanas" role="group" aria-label="Secciones">
            <button type="button" data-sec="cartas">Cartas</button><button type="button" data-sec="informes">Informes</button><button type="button" data-sec="datos">Datos NASA</button><button type="button" data-sec="aprendido">Lo aprendido</button>
          </div>
          <button type="button" id="bt-cerrar">Cerrar ✕</button>
          <div class="bt-pag izq-p" id="bt-izq"></div>
          <div class="bt-pag der-p" id="bt-der"></div>
        </div>
      </section>
      <section id="mj" class="panel" aria-live="polite" hidden></section>
      <div id="toast" role="status"></div>
    </div>
  </div>
  <details id="ctrl">
    <summary id="equipo-sum">herramientas del equipo</summary>
    <div class="ctl-wrap" id="equipo">
      <div class="ctl" role="group" aria-label="Dónde se juega"><span>Uso</span>
        <button type="button" data-uso="libre">Libre</button><button type="button" data-uso="educativo">Salón</button>
        <label for="c-grado" id="l-grado" hidden>grado <select id="c-grado"><option value="1">1°</option><option value="2">2°</option><option value="3">3°</option><option value="4">4°</option><option value="5">5°</option><option value="6">6°</option></select></label></div>
      <div class="ctl" role="group" aria-label="Modo"><span>Modo</span>
        <button type="button" data-modo="manual">Tú juegas</button><button type="button" data-modo="auto">Automático</button></div>
      <div class="ctl" role="group" aria-label="Velocidad"><span>Velocidad</span>
        <button type="button" data-vel="1">1×</button><button type="button" data-vel="2">2×</button><button type="button" data-vel="4">4×</button></div>
      <label class="ctl" for="c-hab">Habilidad <input id="c-hab" type="range" min="10" max="100" step="5" value="70"><output id="o-hab">70%</output></label>
      <label class="ctl" for="c-comp">Comprensión <input id="c-comp" type="range" min="10" max="100" step="5" value="65"><output id="o-comp">65%</output></label>
      <div class="ctl"><button type="button" id="c-voz" aria-pressed="false">Voz en off (lectura 1)</button></div>
      <div class="ctl"><button type="button" id="c-reiniciar">Nueva partida</button><button type="button" id="c-menu">Menú</button><button type="button" id="c-borrar">Borrar progreso</button></div>
      <div class="ctl" role="group" aria-label="Ver un final"><span>Finales</span>
        <button type="button" data-final="perfecta">3★</button><button type="button" data-final="verde">2★</button><button type="button" data-final="relevo">1★</button>
        <button type="button" data-final="apagon">apagón</button><button type="button" data-final="despensa">despensa</button><button type="button" data-final="radiacion">radiación</button><button type="button" data-final="agotado">agotado</button></div>
      <div class="ctl ancho" aria-live="polite"><span>Solo el equipo lo ve:</span><output id="c-equipo">—</output></div>
      <div class="ctl ancho"><span>Datos:</span><output id="c-apis">—</output></div>
      <div id="log" aria-label="Bitácora"></div>
    </div>
  </details>
</div>

<script src="js/luna.js"></script>
<script src="js/espacio.js"></script>
<script src="js/nave.js"></script>
<script src="js/musica.js"></script>
<script src="js/musica-base.js"></script>
<script src="js/sfx.js"></script>
<script src="js/finales.js"></script>
<script src="js/datos.js"></script>
<script src="js/escenas.js"></script>
<script src="js/apis.js"></script>
<script src="js/preguntas.js"></script>
<script src="js/minijuegos.js"></script>
<script src="js/bitacora.js"></script>
<script src="js/juego.js"></script>
</body>
</html>

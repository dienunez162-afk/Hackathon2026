name: Prueba de humo

# En cada pull request y en cada cambio a main: pruebas de funciones + el juego jugado de verdad en un navegador.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de funciones
        run: npm run check
      - name: Prueba de humo (Chrome incluido en el runner)
        run: npm run humo

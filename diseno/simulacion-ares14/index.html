<title>ARES-14</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Escenario 16:9 del juego (lienzo ASCII + HUD de la base encima) y una franja de controles de diseño debajo. Un solo look oscuro, el del arte de ARES-14. */
:root {
  --negro: rgb(0, 0, 0);
  --ink: rgb(235, 240, 255);
  --dim: rgb(140, 148, 168);
  --faint: rgb(78, 86, 104);
  --crema: rgb(255, 246, 225);
  --azul: rgb(60, 150, 255);
  --hielo: rgb(190, 235, 255);
  --rojo: rgb(235, 80, 92);
  --ambar: rgb(255, 176, 72);
  --menta: rgb(140, 245, 205);
  --panel: rgba(8, 11, 20, 0.84);
  --borde: rgba(150, 170, 220, 0.28);
  --mono: 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--negro); color: var(--ink); font-family: var(--mono); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; }
#stage { position: relative; flex: none; background: var(--negro); }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; display: block; }
#hud { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; font-size: 15px; line-height: 1.45; }
#hud > * { pointer-events: auto; }
#hud button { font-family: var(--mono); }

/* barra superior y días */
.top { position: absolute; left: 16px; right: 330px; top: 10px; display: flex; align-items: center; gap: 18px; }
#h-dia { font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
#h-dia small { display: block; font-weight: 400; color: var(--dim); letter-spacing: 0.04em; font-size: 12px; }
#h-track { display: flex; gap: 4px; }
.dia { width: 30px; height: 30px; border: 1px solid var(--borde); display: grid; place-items: center; font-size: 11px; color: var(--faint); position: relative; background: rgba(8, 11, 20, 0.6); }
.dia.noche { background: rgba(20, 30, 80, 0.55); }
.dia.pasado { color: var(--dim); border-color: rgba(150, 170, 220, 0.5); }
.dia.hoy { color: var(--negro); background: var(--crema); border-color: var(--crema); font-weight: 700; }
.dia i { position: absolute; bottom: -7px; width: 6px; height: 6px; border-radius: 50%; }
.dia i.ll { left: 4px; background: var(--azul); }
.dia i.av { left: 12px; background: var(--rojo); }
.dia i.ev { right: 4px; background: var(--crema); border-radius: 0; transform: rotate(45deg); }

.panel { background: var(--panel); border: 1px solid var(--borde); }
.panel h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.16em; color: var(--dim); font-weight: 400; display: flex; justify-content: space-between; }

/* sistemas */
.izq { position: absolute; left: 16px; top: 62px; width: 300px; padding: 14px; box-sizing: border-box; }
.barra { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 12px; position: relative; }
.barra .lbl { font-size: 12px; letter-spacing: 0.1em; color: var(--dim); }
.barra .val { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.barra .ascii { grid-column: 1 / -1; font-size: 14px; letter-spacing: 0.5px; white-space: pre; }
.barra .delta { position: absolute; right: 44px; top: -2px; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
.barra .delta.on { opacity: 1; }
.barra.pulsa .ascii { animation: pulso 0.6s ease 2; }
@keyframes pulso { 50% { filter: brightness(1.8); } }
.z-verde { color: var(--menta); } .z-amarillo { color: var(--ambar); } .z-rojo { color: var(--rojo); }
.bueno { color: var(--menta); } .malo { color: var(--rojo); }
#extra { border-top: 1px dashed var(--borde); padding-top: 10px; font-size: 13px; color: var(--dim); display: grid; gap: 4px; }
#extra b { color: var(--ink); font-weight: 700; }

/* cartas */
.der { position: absolute; right: 16px; top: 62px; width: 300px; padding: 14px; box-sizing: border-box; }
#cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.carta { text-align: left; background: rgba(20, 26, 44, 0.9); border: 1px solid var(--borde); color: var(--ink); padding: 6px 7px; min-height: 52px; cursor: pointer; font-size: 11.5px; line-height: 1.3; display: flex; flex-direction: column; gap: 2px; }
.carta small { color: var(--dim); font-size: 10.5px; }
.carta.bloq { color: var(--faint); cursor: default; border-style: dashed; background: rgba(10, 12, 20, 0.6); }
.carta.usada { opacity: 0.38; cursor: default; }
.carta.armada { border-color: var(--hielo); box-shadow: 0 0 0 1px var(--hielo), 0 0 14px rgba(190, 235, 255, 0.35); }
.carta.nueva { animation: brillo 1.2s ease 3; }
@keyframes brillo { 50% { border-color: var(--crema); box-shadow: 0 0 16px rgba(255, 246, 225, 0.45); } }
.carta:focus-visible, .op:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }
.mini { font-size: 11.5px; color: var(--dim); margin: 10px 0 0; }

/* consola central */
#consola { position: absolute; left: 336px; top: 62px; width: 608px; min-height: 120px; max-height: 548px; overflow: auto; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
.tag { font-size: 12px; letter-spacing: 0.16em; color: var(--dim); }
.tag.llamada { color: var(--azul); }
.tag.alarma { color: var(--rojo); animation: parpadeo 0.9s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0.35; } }
.titulo { font-size: 24px; font-weight: 700; color: var(--crema); margin: 0; line-height: 1.2; }
.txt { margin: 0; font-size: 17px; }
.sub { margin: 0; font-size: 13px; color: var(--dim); }
.paso { font-size: 12px; letter-spacing: 0.12em; color: var(--hielo); margin-top: 4px; }
.ops { display: flex; flex-wrap: wrap; gap: 8px; }
.ops.col { flex-direction: column; }
.op { background: rgba(30, 40, 70, 0.75); border: 1px solid var(--borde); color: var(--ink); padding: 9px 12px; font-size: 15px; text-align: left; cursor: pointer; }
.op:hover:not([disabled]) { border-color: var(--crema); }
.op.prim { background: var(--crema); color: var(--negro); border-color: var(--crema); font-weight: 700; }
.op.ok { border-color: var(--menta); color: var(--menta); }
.op.ko { border-color: var(--rojo); color: var(--rojo); text-decoration: line-through; }
.op.elegida { box-shadow: 0 0 0 2px var(--crema); }
.op[disabled] { cursor: default; }
.pista { font-size: 15px; padding: 4px 0 4px 10px; border-left: 2px solid var(--faint); }
.pista.clave { border-left-color: var(--hielo); color: var(--hielo); }
.res { font-size: 15px; padding: 8px 10px; border: 1px solid var(--borde); }
.res.ok { border-color: var(--menta); }
.res.ko { border-color: var(--rojo); }
.estrellas { color: var(--ambar); letter-spacing: 0.2em; font-size: 30px; }
.grande { font-size: 56px; font-weight: 700; letter-spacing: 0.12em; color: var(--crema); text-align: center; margin: 30px 0 4px; }

/* bitácora y avisos */
#log { position: absolute; left: 16px; bottom: 14px; width: 928px; font-size: 12.5px; color: var(--dim); display: grid; gap: 2px; }
#log div:last-child { color: var(--ink); }
#toast { position: absolute; right: 16px; bottom: 14px; width: 300px; font-size: 13px; padding: 10px 12px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--crema); color: var(--crema); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
#toast.on { opacity: 1; }

/* franja de controles (fuera del juego, para el equipo) */
#ctrl { width: 100%; box-sizing: border-box; padding-block: 8px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgb(10, 12, 18); border-top: 1px solid rgba(150, 170, 220, 0.18); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: center; font-size: 12px; color: var(--dim); }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl button { background: transparent; border: 1px solid rgba(150, 170, 220, 0.3); color: var(--dim); font: 12px var(--mono); padding: 5px 9px; cursor: pointer; }
.ctl button[aria-pressed="true"] { background: var(--crema); color: var(--negro); border-color: var(--crema); }
.ctl input[type=range] { width: 90px; accent-color: var(--crema); }
.ctl output { color: var(--ink); min-width: 32px; }
.ctl select { background: rgb(18, 22, 32); color: var(--ink); border: 1px solid rgba(150, 170, 220, 0.3); font: 12px var(--mono); padding: 3px 4px; }
.ctl.equipo { flex-basis: 100%; justify-content: center; color: var(--faint); }
.ctl.equipo output { color: var(--hielo); }
@media (prefers-reduced-motion: reduce) { .tag.alarma, .carta.nueva, .barra.pulsa .ascii { animation: none; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="juego" width="1280" height="720" aria-label="ARES-14: Luna en ASCII"></canvas>
    <div id="hud" hidden>
      <div class="top"><div id="h-dia"></div><div id="h-track" aria-label="Días de la misión"></div></div>
      <aside class="izq panel" aria-label="Sistemas de la base">
        <h3><span>SISTEMAS</span><span id="h-rama"></span></h3>
        <div id="barras"></div>
        <div id="extra"></div>
      </aside>
      <aside class="der panel" aria-label="Cartas">
        <h3><span>CARTAS</span><span id="n-cartas"></span></h3>
        <div id="cartas"></div>
        <p class="mini" id="cartas-ayuda">Toca una carta para usarla. Escudo: frena la mitad del próximo daño a esa barra. Recurso: suma al instante.</p>
      </aside>
      <section id="consola" class="panel" aria-live="polite"></section>
      <div id="log" aria-label="Bitácora"></div>
      <div id="toast" role="status"></div>
    </div>
  </div>
  <div id="ctrl" aria-label="Controles de la simulación">
    <div class="ctl" role="group" aria-label="Dónde se juega"><span>Uso</span>
      <button type="button" data-uso="libre">Libre</button><button type="button" data-uso="educativo">Salón</button>
      <label for="c-grado" id="l-grado" hidden>grado <select id="c-grado"><option value="1">1°</option><option value="2">2°</option><option value="3">3°</option><option value="4" selected>4°</option><option value="5">5°</option><option value="6">6°</option></select></label></div>
    <div class="ctl" role="group" aria-label="Modo"><span>Modo</span>
      <button type="button" data-modo="manual">Tú decides</button><button type="button" data-modo="auto">Automático</button></div>
    <div class="ctl" role="group" aria-label="Velocidad"><span>Velocidad</span>
      <button type="button" data-vel="1">1×</button><button type="button" data-vel="2">2×</button><button type="button" data-vel="4">4×</button></div>
    <label class="ctl" for="c-hab">Habilidad <input id="c-hab" type="range" min="10" max="100" step="5" value="70"><output id="o-hab">70%</output></label>
    <label class="ctl" for="c-comp">Comprensión <input id="c-comp" type="range" min="10" max="100" step="5" value="65"><output id="o-comp">65%</output></label>
    <div class="ctl"><button type="button" id="c-voz" aria-pressed="false">Voz en off (lectura 1)</button></div>
    <div class="ctl"><button type="button" id="c-reiniciar">Nueva partida</button><button type="button" id="c-menu">Menú</button></div>
    <div class="ctl equipo" aria-live="polite"><span>Solo el equipo lo ve:</span><output id="c-equipo">—</output></div>
  </div>
</div>

<script src="js/luna.js"></script>
<script src="js/espacio.js"></script>
<script src="js/nave.js"></script>
<script src="js/musica.js"></script>
<script src="js/datos.js"></script>
<script src="js/juego.js"></script>
